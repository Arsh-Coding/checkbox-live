<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Real-time Checkbox Grid</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="panel">
    <h1>ClickBox Login</h1>
    <p id="status">Please log in to continue.</p>

    <form id="login-form">
      <label for="username">Username</label>
      <input id="username" name="username" type="text" autocomplete="username" required />

      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required />

      <button type="submit">Login</button>
    </form>
  </div>

  <div class="panel">
    <h1>Real-time Checkbox Grid</h1>
    <p>Open this page in two browser windows and toggle boxes. Both windows should stay in sync.</p>
    <div id="grid"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
